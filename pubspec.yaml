name: free_map
description: "A Flutter package powered by OpenStreetMap for free map, autocomplete places textfield, polylines drawing, geocoding, and reverse geocoding."
version: 2.5.0
homepage: https://github.com/valueoutput-team/flutter_packages/tree/free_map
repository: https://github.com/valueoutput-team/flutter_packages/tree/free_map

environment:
  sdk: ^3.4.0
  flutter: ">=1.17.0"

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

dependencies:
  flutter:
    sdk: flutter

  flutter_map: ^8.2.1
  http: ^1.5.0
  latlong2: ^0.9.1
  package_info_plus: ^8.3.1
  path: ^1.9.1
  sqflite: ^2.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

topics:
  - map
  - geocoding
  - autocomplete
  - polylines
  - openstreetmap
